name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check versions match tag
        run: node scripts/check-versions.mjs ${{ github.ref_name }}

      - name: Check client secret access is confined to the auth path
        run: node scripts/check-secret-access.mjs

      - name: Check product terminology
        run: node scripts/check-terminology.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Install mcpb
        run: npm install -g @anthropic-ai/mcpb

      - name: Validate manifest
        run: mcpb validate .

      - name: Pack bundle
        run: mcpb pack .

      - name: Package plugin zip
        run: scripts/package-plugin.sh ifs-mcp-server-plugin.zip

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-bundles
          path: |
            *.mcpb
            ifs-mcp-server-plugin.zip
          retention-days: 1

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Download bundle artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-bundles

      - name: Rename bundles with version
        run: |
          mv ifs-mcp-server-local.mcpb ifs-mcp-server-${{ github.ref_name }}.mcpb
          mv ifs-mcp-server-plugin.zip ifs-mcp-server-plugin-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ifs-mcp-server-${{ github.ref_name }}.mcpb
            ifs-mcp-server-plugin-${{ github.ref_name }}.zip
          generate_release_notes: true
